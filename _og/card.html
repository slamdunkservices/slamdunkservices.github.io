<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>card</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; background: #0a0a0a; color: #f5f5f5; overflow: hidden;
         font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .wrap { box-sizing: border-box; width: 1200px; height: 630px; padding: 64px 90px 56px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { width: 520px; height: auto; display: block; }
  .title { font-size: 46px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; max-width: 1020px; margin: 0 0 18px; }
  .stat { font-size: 78px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; color: #39ff14; margin: 0 0 16px; }
  .sub { font-size: 30px; line-height: 1.3; color: #b0b0b0; margin: 0; max-width: 1020px; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 26px; color: #b0b0b0; }
  .foot .url { color: #00e5ff; font-weight: 600; }
</style></head>
<body><div class="wrap">
  <img class="logo" src="{{LOGO}}" alt="">
  <div>
    <p class="title">{{TITLE}}</p>
    <p class="stat">{{STAT}}</p>
    <p class="sub">{{SUB}}</p>
  </div>
  <div class="foot"><span>{{FOOT}}</span><span class="url">slamdunk.bet</span></div>
</div></body></html>
