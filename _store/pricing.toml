# Data store: what is for sale and for how much. The one hand-edited file of the store.
#
#   _store/stripe_sync.py          makes Stripe match this file (products, prices, lookup keys)
#   _scripts/store/build.py        writes the /data/ pages from this file + _store/datasets.json
#   _store/fulfillment/main.py     reads prices back from Stripe at checkout, never from the page
#
# Prices are whole US dollars, one-time payments.
#   pass     the season in progress: every file for that dataset, rebuilt each morning, yours to keep
#   season   one completed season
#   all      every dataset for the league (one season, or the pass)
#   archive  every dataset for every completed season we hold
# `current` is the season a pass covers. Leave it "" between seasons: the pass comes off sale and the
# season that just ended sells as a completed season. Season rollover = edit `current`, run the sync.

[store]
# URL printed by `_store/fulfillment/deploy.sh deploy`. Empty = buy buttons show "opening soon".
api = ""
support_email = "slamdunkbettingservices@gmail.com"

[datasets.player-logs]
name = "Player Game Logs"
blurb = "One row per player per game: the full stat line and the game context around it."

[datasets.team-logs]
name = "Team Game Logs"
blurb = "One row per team per game: team totals, the result and the game context around them."

[datasets.play-by-play]
name = "Play-by-Play"
blurb = "Every play of every game, one file per season, in one schema across seasons."

[datasets.schedule]
name = "Games and Results"
blurb = "One row per game: teams, date, final score and the game-level facts that go with it."

[datasets.first-events]
name = "First Events"
blurb = "One row per game: who won the opening tip, who scored first and how, and the first of everything else."

[leagues.nba]
name = "NBA"
current = "2026-27"
cadence = "Rebuilt every morning by 8 AM ET"

[leagues.nba.prices]
player-logs  = { pass = 49, season = 12 }
